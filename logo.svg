    <use href="#kx-arm" transform="rotate(180 32 32)"/>
  </g>
  <g stroke="#fff" stroke-width="4.2">
    <use href="#kx-arm" transform="rotate(60 32 32)"/>
    <use href="#kx-arm" transform="rotate(120 32 32)"/>
    <use href="#kx-arm" transform="rotate(240 32 32)"/>
    <use href="#kx-arm" transform="rotate(300 32 32)"/>
  </g>
  <g fill="#fff">
    <circle cx="32" cy="11.5" r="2.4" fill="#bdeeff" opacity=".75"/>
    <circle cx="32" cy="52.5" r="2.4" fill="#bdeeff" opacity=".75"/>
    <path d="M32 26.2l5 2.9v5.8l-5 2.9-5-2.9v-5.8z"/>
  </g>
  <path d="M32 29.6l2.1 1.2v2.4L32 34.4l-2.1-1.2v-2.4z" fill="#0b6fd6"/>

  <g clip-path="url(#kx-cap)" fill="none" stroke-width="6" stroke-linejoin="miter">
    <g stroke="#0b1f3a">
      <path d="M87 16V48"/>                                   <!-- K -->
      <path d="M108 15L91 32l17 17"/>
