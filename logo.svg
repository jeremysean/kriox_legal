    <g id="kx-arm" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 32V11.5"/>
      <path d="M26.6 16.4L32 21.8l5.4-5.4"/>
    </g>
    <!-- flat tops and bottoms on the letters: cap height 18-46 -->
    <clipPath id="kx-cap"><rect x="80" y="18" width="146" height="28"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#kx-bg)"/>
  <g stroke="#bdeeff" stroke-width="2.6" opacity=".75">
