<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 64" role="img" aria-label="Kriox">
  <defs>
    <linearGradient id="kx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0052b4"/>
      <stop offset="1" stop-color="#19c3f0"/>
    </linearGradient>
    <linearGradient id="kx-x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0064d9"/>
      <stop offset="1" stop-color="#19c3f0"/>
